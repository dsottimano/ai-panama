<style>.pz-header{position:sticky;top:0;z-index:20;background:#f4f0e8;border-bottom:5px solid #080808;display:flex;align-items:center;justify-content:space-between;padding:.9rem 2rem;font-family:Inter,Arial,sans-serif}.pz-brand{font-family:"Space Grotesk",Inter,sans-serif;font-size:1.45rem;font-weight:950;text-transform:uppercase;text-decoration:none;letter-spacing:-.05em}.pz-nav{display:flex;gap:1rem}.pz-nav a{font-weight:900;text-transform:uppercase;color:#080808;text-decoration:none;border-bottom:3px solid transparent}.pz-nav a:hover{border-color:#ff2a1a}@media(max-width:600px){.pz-header{padding:.8rem 1rem}.pz-nav{gap:.6rem}.pz-nav a{font-size:.75rem}}</style><header class="pz-header"><a class="pz-brand" href="{{ homeUrl }}">{{ siteName }}</a><nav class="pz-nav" aria-label="Main navigation">{{#each menuHeader}}<a href="{{ url }}">{{ label }}</a>{{/each}}</nav></header>
