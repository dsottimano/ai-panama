<style>
:root{--padel-red:#ff2a1a;--padel-blue:#1857ff;--padel-black:#080808;--padel-cream:#f4f0e8;--padel-yellow:#eaff00}
*{box-sizing:border-box}.pz-page{background:var(--padel-cream);color:var(--padel-black);font-family:Inter,Arial,sans-serif;overflow:hidden}.pz-page *{border-radius:0!important}.pz-page a{color:inherit}.pz-hero{min-height:82vh;display:grid;grid-template-columns:1.35fr .65fr;border-bottom:6px solid #000}.pz-hero-copy{padding:clamp(2rem,6vw,6rem);display:flex;flex-direction:column;justify-content:space-between}.pz-kicker{font-size:.8rem;font-weight:900;letter-spacing:.16em;text-transform:uppercase;border:3px solid #000;padding:.55rem .7rem;width:max-content;background:var(--padel-yellow);box-shadow:5px 5px 0 #000}.pz-title{font-family:"Space Grotesk",Inter,sans-serif;font-size:clamp(4rem,11vw,10rem);line-height:.75;letter-spacing:-.08em;text-transform:uppercase;margin:3rem 0 2rem;max-width:9ch}.pz-title span{color:var(--padel-red)}.pz-lead{font-size:clamp(1.15rem,2vw,1.65rem);font-weight:700;max-width:32rem}.pz-actions{display:flex;flex-wrap:wrap;gap:1rem;margin-top:2rem}.pz-btn{display:inline-block;padding:1rem 1.4rem;border:4px solid #000;font-weight:950;text-transform:uppercase;text-decoration:none;box-shadow:7px 7px 0 #000;transition:.12s}.pz-btn:hover{transform:translate(3px,3px);box-shadow:4px 4px 0 #000}.pz-btn-red{background:var(--padel-red);color:#fff!important}.pz-btn-blue{background:var(--padel-blue);color:#fff!important}.pz-court{background:var(--padel-blue);border-left:6px solid #000;position:relative;min-height:550px}.pz-court:before,.pz-court:after{content:"";position:absolute;border:5px solid #fff}.pz-court:before{inset:7%}.pz-court:after{left:7%;right:7%;top:50%;border-width:5px 0 0}.pz-ball{position:absolute;width:105px;height:105px;background:var(--padel-yellow);border:5px solid #000;border-radius:50%!important;right:12%;top:13%;box-shadow:10px 10px 0 #000}.pz-racket{position:absolute;width:170px;height:230px;background:var(--padel-red);border:6px solid #000;border-radius:46%!important;left:13%;bottom:12%;transform:rotate(-17deg);box-shadow:12px 12px 0 #000}.pz-racket:after{content:"";position:absolute;width:38px;height:120px;background:#000;left:60px;bottom:-98px}.pz-ticker{display:flex;gap:3rem;white-space:nowrap;background:#000;color:#fff;padding:.9rem 0;font-weight:900;text-transform:uppercase;font-size:1.1rem;overflow:hidden}.pz-section{padding:clamp(3rem,7vw,7rem);border-bottom:6px solid #000}.pz-section h2{font-family:"Space Grotesk",Inter,sans-serif;font-size:clamp(3rem,8vw,7rem);line-height:.85;letter-spacing:-.06em;text-transform:uppercase;margin:0 0 3rem}.pz-products{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:4px solid #000}.pz-card{min-height:390px;padding:1.5rem;border-right:4px solid #000;display:flex;flex-direction:column;justify-content:space-between}.pz-card:last-child{border-right:0}.pz-card:nth-child(1){background:#fff}.pz-card:nth-child(2){background:var(--padel-red);color:#fff}.pz-card:nth-child(3){background:var(--padel-blue);color:#fff}.pz-product-art{height:170px;border:4px solid #000;background:var(--padel-yellow);display:grid;place-items:center;font-size:5rem;font-weight:900;color:#000;box-shadow:8px 8px 0 #000}.pz-card h3{font-size:2rem;line-height:.95;text-transform:uppercase;margin:2rem 0 .5rem}.pz-price{font-size:1.5rem;font-weight:950}.pz-about{display:grid;grid-template-columns:1fr 1fr;padding:0!important}.pz-about>div{padding:clamp(3rem,7vw,7rem)}.pz-about-copy{background:var(--padel-yellow);border-right:6px solid #000}.pz-about p{font-size:clamp(1.2rem,2vw,1.65rem);font-weight:700}.pz-list{list-style:none;padding:0;margin:2rem 0 0}.pz-list li{padding:1rem 0;border-top:3px solid #000;font-weight:900;text-transform:uppercase}.pz-contact{background:var(--padel-red);color:#fff;text-align:center}.pz-contact h2{max-width:10ch;margin-left:auto;margin-right:auto}.pz-contact p{font-size:1.25rem;font-weight:800}.pz-contact .pz-btn{background:var(--padel-yellow);color:#000!important}
@media(max-width:800px){.pz-hero{grid-template-columns:1fr}.pz-court{border-left:0;border-top:6px solid #000;min-height:430px}.pz-products{grid-template-columns:1fr}.pz-card{border-right:0;border-bottom:4px solid #000}.pz-card:last-child{border-bottom:0}.pz-about{grid-template-columns:1fr}.pz-about-copy{border-right:0;border-bottom:6px solid #000}.pz-title{font-size:clamp(4rem,22vw,7rem)}}
</style>
<main class="pz-page">{{{ body }}}</main>
